<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Kovan: a live 3D hive of your Claude Code and Codex sessions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#16130e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.55" r="0.42">
      <stop offset="0" stop-color="#f5b13d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5b13d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#ffb224"/>
      <stop offset="1" stop-color="#e07b0a"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- floor: a short arc of cells, not a department map -->
    <g fill="#1b2029" stroke="#2c3340" stroke-width="1.2" opacity="0.9">
      <polygon points="760,250 792,232 824,250 824,286 792,304 760,286"/>
      <polygon points="828,250 860,232 892,250 892,286 860,304 828,286"/>
      <polygon points="896,250 928,232 960,250 960,286 928,304 896,286"/>
      <polygon points="964,250 996,232 1028,250 1028,286 996,304 964,286"/>
      <polygon points="1032,250 1064,232 1096,250 1096,286 1064,304 1032,286"/>
      <polygon points="794,304 826,286 858,304 858,340 826,358 794,340"/>
      <polygon points="862,304 894,286 926,304 926,340 894,358 862,340"/>
      <polygon points="930,304 962,286 994,304 994,340 962,358 930,340"/>
      <polygon points="998,304 1030,286 1062,304 1062,340 1030,358 998,340"/>
    </g>

    <!-- three project zones -->
    <g stroke-linejoin="round">
      <polygon points="900,168 948,140 996,168 996,224 948,252 900,224" fill="#10241f" stroke="#3ee6c8" stroke-width="2.4"/>
      <polygon points="1048,118 1090,94 1132,118 1132,166 1090,190 1048,166" fill="#2a2112" stroke="#f5b13d" stroke-width="2.2"/>
      <polygon points="1072,236 1116,210 1160,236 1160,288 1116,314 1072,288" fill="#141c2e" stroke="#7aa2ff" stroke-width="2.2"/>
    </g>

    <!-- core -->
    <polygon points="1004,196 1024,184 1044,196 1044,220 1024,232 1004,220" fill="url(#gem)"/>
    <polygon points="1012,204 1024,197 1036,204 1036,216 1024,223 1012,216" fill="#fff4d2" opacity="0.55"/>

    <!-- bees: body, stripe, wings -->
    <g>
      <!-- working bee on the teal zone -->
      <ellipse cx="934" cy="176" rx="16" ry="7" fill="#9ff3e2" opacity="0.35"/>
      <ellipse cx="968" cy="176" rx="16" ry="7" fill="#9ff3e2" opacity="0.35"/>
      <ellipse cx="951" cy="196" rx="8" ry="16" fill="#f6ecdc"/>
      <path d="M943 192h16M943 200h16" stroke="#1a120a" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="951" cy="176" r="5.5" fill="#1a120a"/>
      <!-- second bee, waiting, slightly lifted -->
      <ellipse cx="972" cy="214" rx="13" ry="6" fill="#b8fff0" opacity="0.45"/>
      <ellipse cx="996" cy="210" rx="13" ry="6" fill="#b8fff0" opacity="0.45"/>
      <ellipse cx="984" cy="226" rx="7" ry="13" fill="#ffe7b0"/>
      <path d="M977 222h14M977 229h14" stroke="#1a120a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="984" cy="210" r="4.5" fill="#1a120a"/>
      <!-- amber zone -->
      <ellipse cx="1078" cy="128" rx="14" ry="6" fill="#ffe1a8" opacity="0.4"/>
      <ellipse cx="1106" cy="128" rx="14" ry="6" fill="#ffe1a8" opacity="0.4"/>
      <ellipse cx="1092" cy="146" rx="7" ry="13" fill="#f6ecdc"/>
      <path d="M1085 142h14M1085 149h14" stroke="#1a120a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="1092" cy="130" r="4.5" fill="#1a120a"/>
      <!-- blue zone -->
      <ellipse cx="1104" cy="248" rx="14" ry="6" fill="#c9d8ff" opacity="0.4"/>
      <ellipse cx="1132" cy="248" rx="14" ry="6" fill="#c9d8ff" opacity="0.4"/>
      <ellipse cx="1118" cy="266" rx="7" ry="13" fill="#f6ecdc"/>
      <path d="M1111 262h14M1111 269h14" stroke="#1a120a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="1118" cy="250" r="4.5" fill="#1a120a"/>
    </g>

    <!-- zone names -->
    <g font-family="Inter, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="848" y="258" width="138" height="22" rx="11" fill="#10151c" stroke="#3ee6c8" stroke-opacity="0.7"/>
      <text x="860" y="273" fill="#e8ecf2">lighthouse-api</text>
      <rect x="1040" y="72" width="112" height="22" rx="11" fill="#10151c" stroke="#f5b13d" stroke-opacity="0.75"/>
      <text x="1054" y="87" fill="#e8ecf2">northwind-web</text>
      <rect x="1088" y="322" width="102" height="22" rx="11" fill="#10151c" stroke="#7aa2ff" stroke-opacity="0.75"/>
      <text x="1102" y="337" fill="#e8ecf2">paperkite-cli</text>
    </g>

    <!-- approval badge -->
    <g>
      <rect x="1008" y="78" width="168" height="64" rx="14" fill="#10151c" stroke="#3ee6c8" stroke-width="1.6"/>
      <circle cx="1028" cy="100" r="5" fill="#3ee6c8"/>
      <text x="1042" y="105" fill="#3ee6c8" font-family="Inter, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Needs you</text>
      <text x="1024" y="126" fill="#c9d1dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Edit · hive.ts</text>
    </g>

    <!-- wordmark and pitch -->
    <text x="72" y="156" fill="#eef2f7" font-family="Inter, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1">kovan</text>
    <text x="72" y="214" fill="#c9d1dd" font-family="Inter, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="650">All your coding agents, one live hive.</text>
    <text x="72" y="250" fill="#8b95a6" font-family="Inter, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">See who is working, who is stuck, and who needs you.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f5b13d">
      <rect x="72" y="286" width="108" height="30" rx="15" fill="#11151c" stroke="#2a313d"/>
      <text x="86" y="306">live hive</text>
      <rect x="190" y="286" width="158" height="30" rx="15" fill="#11151c" stroke="#2a313d"/>
      <text x="204" y="306">approve in place</text>
      <rect x="358" y="286" width="118" height="30" rx="15" fill="#11151c" stroke="#2a313d"/>
      <text x="372" y="306">local-first</text>
    </g>
  </g>
</svg>
